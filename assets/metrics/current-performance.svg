<svg xmlns="http://www.w3.org/2000/svg" width="960" height="410" viewBox="0 0 960 410" role="img" aria-labelledby="title description">
  <title id="title">Estado atual de desempenho experimental</title>
  <desc id="description">Três medições locais: Victory em cena inicial a 3,2 FPS; XCL ao entrar no mapa a 8,5 FPS antes de parar; XCL no menu a 30 FPS. As medições não são um benchmark comparável.</desc>
  <rect width="960" height="410" fill="#10131a"/>
